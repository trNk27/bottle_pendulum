<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<title>Pendulum Painter</title>
<meta name="theme-color" content="#fff3e2">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath d='M4 28c4-7 10-7 12-3s9 4 12-3' fill='none' stroke='%238338ec' stroke-width='3' stroke-linecap='round'/%3E%3Cpath d='M12 2l7 13' stroke='%232b2140' stroke-width='2.5' stroke-linecap='round'/%3E%3Ccircle cx='20' cy='17' r='5' fill='%2306d6a0' stroke='%232b2140' stroke-width='2.5'/%3E%3C/svg%3E">
<style>
  :root { --ink: #2b2140; --bg: #fff3e2; --accent: #ffd60a; }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; height: 100%; overflow: hidden; background: var(--bg);
    touch-action: none; user-select: none; -webkit-user-select: none;
    -webkit-tap-highlight-color: transparent; -webkit-touch-callout: none;
  }
  body {
    background-image: radial-gradient(rgba(43,33,64,.08) 1.6px, transparent 1.8px);
    background-size: 24px 24px;
  }
  #scene { position: fixed; inset: 0; display: block; }
  button { font: inherit; color: var(--ink); -webkit-appearance: none; appearance: none; }
  button:focus-visible, input:focus-visible { outline: 3px dashed var(--ink); outline-offset: 4px; }

  /* ---- stage stepper ---- */
  #steps {
    position: fixed; top: max(12px, env(safe-area-inset-top)); left: 50%;
    transform: translateX(-50%); display: flex; align-items: center; gap: 6px; z-index: 3;
  }
  .step {
    width: 54px; height: 54px; border-radius: 50%; border: 3px solid var(--ink); background: #fff;
    box-shadow: 0 4px 0 var(--ink); display: grid; place-items: center; cursor: pointer; padding: 0;
    transition: transform .25s cubic-bezier(.3,1.6,.5,1), background .2s, opacity .2s; opacity: .75;
  }
  .step svg { width: 32px; height: 32px; pointer-events: none; }
  .step.on { background: var(--accent); transform: scale(1.14); opacity: 1; }
  .step:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--ink); }
  .dots { width: 26px; border-top: 4px dotted var(--ink); opacity: .3; }
  .nudge { animation: nudge 1.1s ease-in-out infinite; opacity: 1; }
  @keyframes nudge { 0%,100% { transform: scale(1) rotate(0); } 30% { transform: scale(1.18) rotate(-8deg); } 60% { transform: scale(1.1) rotate(6deg); } }

  /* ---- bottom toolbar ---- */
  #toolbar {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 3; display: flex; justify-content: center;
    padding: 12px 12px max(16px, env(safe-area-inset-bottom)); pointer-events: none;
  }
  .group {
    display: none; flex-wrap: wrap; justify-content: center; align-items: center; gap: 10px;
    pointer-events: auto; max-width: 820px;
  }
  .group.on { display: flex; animation: pop .4s cubic-bezier(.3,1.6,.5,1); }
  @keyframes pop { from { transform: translateY(30px) scale(.9); opacity: 0; } }
  .btn {
    width: 54px; height: 54px; border-radius: 18px; border: 3px solid var(--ink); background: #fff;
    box-shadow: 0 4px 0 var(--ink); display: grid; place-items: center; cursor: pointer; padding: 0;
    transition: transform .1s, background .2s, opacity .2s;
  }
  .btn svg { width: 28px; height: 28px; pointer-events: none; }
  .btn:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--ink); }
  .btn.on { background: var(--accent); }
  .btn:disabled { opacity: .35; cursor: default; }
  .sep { width: 4px; height: 36px; border-radius: 2px; background: var(--ink); opacity: .14; }

  .pot {
    width: 52px; height: 52px; border-radius: 50%; border: 3px solid var(--ink); background: var(--c);
    box-shadow: 0 4px 0 var(--ink), inset -7px -8px 0 rgba(0,0,0,.13), inset 7px 6px 0 rgba(255,255,255,.4);
    cursor: pointer; padding: 0; transition: transform .15s cubic-bezier(.3,1.6,.5,1); position: relative;
  }
  .pot.pouring { transform: translateY(3px) scale(.88) rotate(-14deg);
    box-shadow: 0 1px 0 var(--ink), inset -7px -8px 0 rgba(0,0,0,.13), inset 7px 6px 0 rgba(255,255,255,.4); }
  .pot.hint { animation: hint 1.4s ease-in-out infinite; }
  .pot.hint::after {
    content: ''; position: absolute; inset: -10px; border-radius: 50%; border: 3px solid var(--ink);
    animation: ripple 1.4s ease-out infinite; pointer-events: none;
  }
  @keyframes hint { 0%,100% { transform: translateY(0); } 40% { transform: translateY(-10px); } 60% { transform: translateY(2px) scale(.94); } }
  @keyframes ripple { 0%,50% { transform: scale(.6); opacity: 0; } 60% { opacity: .5; } 100% { transform: scale(1.25); opacity: 0; } }
  .pot.add {
    background: conic-gradient(#ff4d6d, #ff9f1c, #ffd60a, #06d6a0, #3a86ff, #8338ec, #ff4d6d);
    display: grid; place-items: center;
  }
  .pot.add svg { width: 26px; height: 26px; background: #fff; border-radius: 50%; border: 2.5px solid var(--ink); pointer-events: none; }
  .pot.fresh { animation: drop-in .5s cubic-bezier(.3,1.6,.5,1); }
  @keyframes drop-in { from { transform: translateY(-60px) scale(.3); } }

  .slider {
    display: flex; align-items: center; gap: 4px; background: #fff; border: 3px solid var(--ink);
    border-radius: 18px; box-shadow: 0 4px 0 var(--ink); height: 54px; padding: 0 8px;
  }
  .slider svg { width: 24px; height: 24px; flex: none; }
  input[type=range] {
    -webkit-appearance: none; appearance: none; width: 110px; height: 8px; border-radius: 4px;
    background: rgba(43,33,64,.18); margin: 0 4px; cursor: pointer;
  }
  input[type=range]::-webkit-slider-thumb {
    -webkit-appearance: none; width: 26px; height: 26px; border-radius: 50%;
    background: #06d6a0; border: 3px solid var(--ink); box-shadow: 0 2px 0 var(--ink);
  }
  input[type=range]::-moz-range-thumb {
    width: 20px; height: 20px; border-radius: 50%; background: #06d6a0; border: 3px solid var(--ink);
  }
  .swatch {
    width: 38px; height: 38px; border-radius: 50%; border: 3px solid var(--ink); background: var(--c);
    cursor: pointer; padding: 0; transition: transform .2s cubic-bezier(.3,1.6,.5,1);
  }
  .swatch.on { transform: scale(1.18); box-shadow: 0 0 0 4px var(--bg), 0 0 0 7px var(--ink); }
  .size { border-radius: 50%; }
  .size i { display: block; border-radius: 50%; background: var(--ink); }

  #next {
    position: fixed; right: 16px; top: 50%; width: 66px; height: 66px; border-radius: 50%; z-index: 3;
    border: 3px solid var(--ink); background: var(--accent); box-shadow: 0 5px 0 var(--ink);
    display: grid; place-items: center; cursor: pointer; padding: 0;
    transform: translateY(-50%) scale(0); transition: transform .35s cubic-bezier(.3,1.6,.5,1);
  }
  #next svg { width: 34px; height: 34px; pointer-events: none; }
  #next.show { transform: translateY(-50%) scale(1); }
  #next.show svg { animation: wiggle 1.4s ease-in-out infinite .4s; }
  @keyframes wiggle { 0%,100% { transform: translateX(0); } 50% { transform: translateX(6px); } }

  #picker { position: fixed; left: 50%; bottom: 0; width: 1px; height: 1px; opacity: 0; pointer-events: none; border: 0; padding: 0; }

  @media (max-width: 560px) {
    .pot { width: 42px; height: 42px; }
    .btn, .slider { height: 46px; } .btn { width: 46px; border-radius: 15px; }
    .step { width: 46px; height: 46px; } .step svg { width: 28px; height: 28px; }
    .dots { width: 16px; }
    input[type=range] { width: 76px; }
    .swatch { width: 32px; height: 32px; }
    #next { width: 56px; height: 56px; right: 10px; }
    .group { gap: 8px; }
  }
</style>
</head>
<body>
<canvas id="scene"></canvas>

<nav id="steps">
  <button class="step on" data-s="0" aria-label="fill">
    <svg viewBox="0 0 32 32"><defs><clipPath id="sc"><path d="M8 6h16v17a4 4 0 0 1-4 4h-8a4 4 0 0 1-4-4z"/></clipPath></defs>
      <g clip-path="url(#sc)"><rect x="6" y="5" width="20" height="24" fill="#fff"/><rect x="6" y="20" width="20" height="9" fill="#3a86ff"/><rect x="6" y="15" width="20" height="5" fill="#ffd60a"/><rect x="6" y="11" width="20" height="4" fill="#ff4d6d"/></g>
      <path d="M8 6h16v17a4 4 0 0 1-4 4h-8a4 4 0 0 1-4-4z" fill="none" stroke="#2b2140" stroke-width="2.6" stroke-linejoin="round"/></svg>
  </button>
  <span class="dots"></span>
  <button class="step" data-s="1" aria-label="poke">
    <svg viewBox="0 0 32 32"><path d="M5 27 17 15" stroke="#2b2140" stroke-width="2.8" stroke-linecap="round"/><circle cx="21" cy="11" r="6.5" fill="#ff4d6d" stroke="#2b2140" stroke-width="2.6"/><circle cx="19" cy="9" r="1.8" fill="#fff"/></svg>
  </button>
  <span class="dots"></span>
  <button class="step" data-s="2" aria-label="swing">
    <svg viewBox="0 0 32 32"><path d="M4 27c3-6 8-8 11-4s-2 6-3 2 7-8 11-5 3 6 6 3" fill="none" stroke="#8338ec" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/><path d="M11 2l8 12" stroke="#2b2140" stroke-width="2.4" stroke-linecap="round"/><circle cx="20" cy="15.5" r="4.6" fill="#06d6a0" stroke="#2b2140" stroke-width="2.5"/></svg>
  </button>
</nav>

<div id="toolbar">
  <!-- fill -->
  <div class="group on" data-g="0" id="g0">
    <button class="pot add" id="addPot" aria-label="custom colour">
      <svg viewBox="0 0 24 24"><path d="M12 6v12M6 12h12" stroke="#2b2140" stroke-width="3.4" stroke-linecap="round"/></svg>
    </button>
    <span class="sep"></span>
    <button class="btn" id="undo" aria-label="undo">
      <svg viewBox="0 0 24 24" fill="none" stroke="#2b2140" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 14 4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H11"/></svg>
    </button>
    <button class="btn" id="empty" aria-label="empty">
      <svg viewBox="0 0 24 24" fill="none" stroke="#2b2140" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13M10 11v5M14 11v5"/></svg>
    </button>
  </div>
  <!-- poke -->
  <div class="group" data-g="1">
    <button class="btn size" data-a="0.5" aria-label="small hole"><i style="width:7px;height:7px"></i></button>
    <button class="btn size on" data-a="1.1" aria-label="medium hole"><i style="width:13px;height:13px"></i></button>
    <button class="btn size" data-a="2" aria-label="large hole"><i style="width:20px;height:20px"></i></button>
    <span class="sep"></span>
    <button class="btn" id="patch" aria-label="patch all holes">
      <svg viewBox="0 0 24 24"><g transform="rotate(-45 12 12)"><rect x="1.5" y="7.5" width="21" height="9" rx="4.5" fill="#f4b183" stroke="#2b2140" stroke-width="2.2"/><rect x="8.5" y="7.5" width="7" height="9" fill="#fbd8bb" stroke="#2b2140" stroke-width="1.8"/><circle cx="4.8" cy="12" r=".9" fill="#2b2140"/><circle cx="19.2" cy="12" r=".9" fill="#2b2140"/></g></svg>
    </button>
  </div>
  <!-- swing -->
  <div class="group" data-g="2">
    <div class="slider">
      <svg viewBox="0 0 24 24"><path d="M12 2v7" stroke="#2b2140" stroke-width="2.4" stroke-linecap="round"/><circle cx="12" cy="12.5" r="3.6" fill="#06d6a0" stroke="#2b2140" stroke-width="2.2"/></svg>
      <input type="range" id="len" min="80" max="300" value="160" aria-label="string length">
      <svg viewBox="0 0 24 24"><path d="M12 1v15" stroke="#2b2140" stroke-width="2.4" stroke-linecap="round"/><circle cx="12" cy="19.5" r="3.6" fill="#06d6a0" stroke="#2b2140" stroke-width="2.2"/></svg>
    </div>
    <button class="btn" id="ff" aria-label="fast">
      <svg viewBox="0 0 24 24"><path d="M3 6l8 6-8 6zM12 6l8 6-8 6z" fill="#2b2140" stroke="#2b2140" stroke-width="2" stroke-linejoin="round"/></svg>
    </button>
    <span class="sep"></span>
    <button class="swatch on" data-bg="#fbf8f1" style="--c:#fbf8f1" aria-label="white canvas"></button>
    <button class="swatch" data-bg="#e9cfa6" style="--c:#e9cfa6" aria-label="kraft canvas"></button>
    <button class="swatch" data-bg="#1d1a26" style="--c:#1d1a26" aria-label="black canvas"></button>
    <span class="sep"></span>
    <button class="btn" id="clear" aria-label="clear canvas">
      <svg viewBox="0 0 24 24" fill="none" stroke="#2b2140" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13M10 11v5M14 11v5"/></svg>
    </button>
    <button class="btn" id="save" aria-label="save picture">
      <svg viewBox="0 0 24 24" fill="none" stroke="#2b2140" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12M7 10l5 5 5-5M4 20h16"/></svg>
    </button>
  </div>
</div>

<button id="next" aria-label="next">
  <svg viewBox="0 0 24 24"><path d="M4 12h15M13 6l6 6-6 6" fill="none" stroke="#2b2140" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
</button>
<input type="color" id="picker" value="#ff70a6" tabindex="-1" aria-hidden="true">

<script>
(() => {
'use strict';

// ---------------------------------------------------------------- constants
const INK = '#2b2140', TAU = Math.PI * 2;
const S = 1.4;              // canvas side in metres
const PR = 1600, PS = PR / S; // paint bitmap resolution, px per metre
const RB = 0.045;           // bottle radius (m)
const HB = 0.13;            // bottle height (m)
const DROP = 0.06;          // gap between bottle bottom and canvas (m)
const G0 = 9.81;
const K = 0.03;             // drain coefficient: one medium hole empties a full bottle in about a minute
const POUR = 0.22;          // fill fraction per second while pouring
const DAMP = 0.035;         // air drag on the swing
const PALETTE = ['#ff4d6d', '#ff9f1c', '#ffd60a', '#06d6a0', '#2ec4b6', '#3a86ff', '#8338ec', '#ffffff', '#1d1a26'];

const $ = s => document.querySelector(s);
const $$ = s => [...document.querySelectorAll(s)];
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));

const cv = $('#scene'), ctx = cv.getContext('2d');
const paint = document.createElement('canvas');
paint.width = paint.height = PR;
const pctx = paint.getContext('2d');
pctx.lineCap = 'round'; pctx.lineJoin = 'round';
const tex = makeTexture();
let texPat = null;

const st = {
  stage: 0, layers: [], holes: [], pouring: null, potEl: null, canT: 0, canColor: '#fff', ripple: 0,
  holeSize: 1.1, growing: null, bg: '#fbf8f1', speed: 1,
  poured: false, poked: false, dropped: false, fade: 0, flash: 0, fx: [],
};
const cup = { cx: 0, yk: 0, yt: 0, yb: 0, R: 100, Hc: 200, ry: 32, ang: 0, angV: 0 };
const area = { x0: 0, y0: 0, size: 100 };
const P = { L: 1.6, x: 0, y: 0, z: -1.6, vx: 0, vy: 0, vz: 0, held: false, samples: [] };
let W = 0, H = 0, DPR = 1, time = 0;

function svgCursor(svg, x, y, fallback) {
  return `url("data:image/svg+xml,${encodeURIComponent(svg)}") ${x} ${y}, ${fallback}`;
}
const CUR_PIN = svgCursor(`<svg xmlns='http://www.w3.org/2000/svg' width='32' height='32'><path d='M3 29 17 15' stroke='${INK}' stroke-width='3' stroke-linecap='round'/><circle cx='21' cy='11' r='7' fill='#ff4d6d' stroke='${INK}' stroke-width='2.5'/><circle cx='19' cy='9' r='2' fill='white'/></svg>`, 3, 29, 'crosshair');
const CUR_PATCH = svgCursor(`<svg xmlns='http://www.w3.org/2000/svg' width='32' height='32'><g transform='rotate(-45 16 16)'><rect x='3' y='11' width='26' height='10' rx='5' fill='#f4b183' stroke='${INK}' stroke-width='2.5'/><rect x='12' y='11' width='8' height='10' fill='#fbd8bb' stroke='${INK}' stroke-width='2'/></g></svg>`, 16, 16, 'pointer');

// ---------------------------------------------------------------- paint stack
const level = () => st.layers.reduce((a, l) => a + l.v, 0);
const topColor = () => st.layers.length ? st.layers[st.layers.length - 1].c : null;
function colorAt(f) {
  let c = 0;
  for (const l of st.layers) { c += l.v; if (f < c) return l.c; }
  return null;
}
function addPaint(c, dv) {
  dv = Math.min(dv, 1 - level());
  if (dv <= 1e-6) return false;
  const t = st.layers[st.layers.length - 1];
  if (t && t.c === c) t.v += dv;
  else st.layers.push({ c, v: dv, amp: 0.012 + Math.random() * 0.022, f: 2 + Math.random() * 3, ph: Math.random() * TAU });
  return true;
}
// Drain dv from the layer sitting at height f; layers above slide down. Returns the colour drained.
function removeAt(f, dv) {
  let c = 0, i = 0;
  for (; i < st.layers.length; i++) { if (f < c + st.layers[i].v) break; c += st.layers[i].v; }
  if (i >= st.layers.length) return null;
  const col = st.layers[i].c;
  while (dv > 0 && i < st.layers.length) {
    const l = st.layers[i], t = Math.min(dv, l.v);
    l.v -= t; dv -= t;
    if (l.v <= 1e-7) st.layers.splice(i, 1); else i++;
  }
  return col;
}

// ---------------------------------------------------------------- layout
function resize() {
  DPR = Math.min(2, window.devicePixelRatio || 1);
  W = innerWidth; H = innerHeight;
  cv.width = Math.round(W * DPR); cv.height = Math.round(H * DPR);
  cv.style.width = W + 'px'; cv.style.height = H + 'px';
  texPat = ctx.createPattern(tex, 'repeat');
  layout();
}
function layout() {
  const top = $('#steps').getBoundingClientRect().bottom + 16;
  const bottom = $('#toolbar').getBoundingClientRect().top - 6;
  const avail = Math.max(160, bottom - top);
  const R = Math.max(36, Math.min(W * (W < 600 ? 0.24 : 0.19), avail / 4.3, 150));
  cup.R = R; cup.Hc = R * 2; cup.ry = R * 0.32;
  const total = R * 1.3 + cup.Hc + cup.ry + R * 0.55;
  cup.cx = W / 2; cup.yk = top + (avail - total) / 2 + R * 0.3;
  cup.yt = cup.yk + R; cup.yb = cup.yt + cup.Hc;
  const size = Math.max(120, Math.min(W - 32, avail));
  area.size = size; area.x0 = (W - size) / 2; area.y0 = top + (avail - size) / 2;
}

// ---------------------------------------------------------------- cup geometry (local, un-rotated frame)
const yAt = f => cup.yb - f * cup.Hc;
function toLocal(x, y) {
  const c = Math.cos(cup.ang), s = Math.sin(cup.ang), dx = x - cup.cx;
  return [cup.cx + dx * c + y * s, -dx * s + y * c];
}
function toWorld(x, y) {
  const c = Math.cos(cup.ang), s = Math.sin(cup.ang), dx = x - cup.cx;
  return [cup.cx + dx * c - y * s, dx * s + y * c];
}
const holeR = h => cup.R * 0.03 * (0.6 + h.a * 0.75);
function holePos(h) {
  const { cx, yb, R, ry } = cup, r = holeR(h);
  if (h.t === 'b') return { x: cx + h.bx * R, y: yb - h.bz * ry, rx: r, ry: r * 0.55, r };
  const s = Math.sin(h.th), c = Math.cos(h.th);
  return { x: cx + R * s, y: yAt(h.h) - ry * c, rx: r * Math.max(0.3, c), ry: r, r };
}
function hitCup(x, y) {
  const { cx, yt, yb, R, ry } = cup, ex = (x - cx) / R, ey = (y - yb) / ry;
  if (ex * ex + ey * ey <= 1) {               // bottom disc
    let bx = ex, bz = -ey; const m = Math.hypot(bx, bz);
    if (m > 0.82) { bx *= 0.82 / m; bz *= 0.82 / m; }
    return { t: 'b', bx, bz };
  }
  if (Math.abs(ex) < 1) {                      // front wall
    const s = clamp(ex, -0.93, 0.93), yh = y + ry * Math.sqrt(1 - ex * ex);
    if (yh >= yt && yh <= yb) return { t: 's', th: Math.asin(s), h: clamp((yb - yh) / (yb - yt), 0.03, 0.96) };
  }
  return null;
}
function holeAt(x, y) {
  for (let i = st.holes.length - 1; i >= 0; i--) {
    const p = holePos(st.holes[i]);
    if (Math.hypot(x - p.x, y - p.y) < p.r + 7) return i;
  }
  return -1;
}
function onCup(x, y) {
  const [lx, ly] = toLocal(x, y);
  return Math.abs(lx - cup.cx) < cup.R && ly > cup.yt - cup.ry && ly < cup.yb + cup.ry;
}

// ---------------------------------------------------------------- pendulum physics (spherical pendulum, metres)
function stepP(o, h) {
  o.vx -= DAMP * o.vx * h; o.vy -= DAMP * o.vy * h; o.vz += (-G0 - DAMP * o.vz) * h;
  o.x += o.vx * h; o.y += o.vy * h; o.z += o.vz * h;
  const k = o.L / Math.hypot(o.x, o.y, o.z);
  o.x *= k; o.y *= k; o.z *= k;
  const ux = o.x / o.L, uy = o.y / o.L, uz = o.z / o.L, vr = o.vx * ux + o.vy * uy + o.vz * uz;
  o.vx -= vr * ux; o.vy -= vr * uy; o.vz -= vr * uz;
}
function placeBob(mx, my) {
  const r = Math.hypot(mx, my), rm = Math.min(0.64, P.L * 0.9);
  if (r > rm) { mx *= rm / r; my *= rm / r; }
  P.x = mx; P.y = my; P.z = -Math.sqrt(P.L * P.L - mx * mx - my * my);
}
function predict(vx, vy) {

  const s = area.size / S;
  placeBob((x - area.x0 - area.size / 2) / s, (y - area.y0 - area.size / 2) / s);
  P.vx = P.vy = P.vz = 0;
  P.samples.push({ t: performance.now(), x: P.x, y: P.y });
}
function letGo() {
  if (!P.held) return;
  const [vx, vy] = estVel();
  P.vx = vx; P.vy = vy; P.vz = -(P.x * vx + P.y * vy) / P.z;
  P.held = false; st.dropped = true;
  for (const h of st.holes) { h.last = null; h.pool = 0; }
  cv.style.cursor = 'grab';
}
window.addEventListener('pointermove', e => {
  const x = e.clientX, y = e.clientY;
  if (st.stage === 2) {
    if (P.held) { holdAt(x, y); return; }
    const { x0, y0, size } = area, inside = x > x0 - 40 && x < x0 + size + 40 && y > y0 - 40 && y < y0 + size + 40;
    cv.style.cursor = (x >= x0 + 6 && x <= x0 + 60 && y >= y0 + 6 && y <= y0 + 76) ? 'pointer' : inside ? 'grab' : 'default';
  } else if (st.stage === 1) {
    const [lx, ly] = toLocal(x, y);
    cv.style.cursor = holeAt(lx, ly) >= 0 && !st.growing ? CUR_PATCH : hitCup(lx, ly) ? CUR_PIN : 'default';
  } else {
    cv.style.cursor = onCup(x, y) ? 'pointer' : 'default';
  }
});
const endPointer = e => {
  if (st.stage === 2) letGo();
  if (e.pointerId === pokeId) { st.growing = null; pokeId = null; }
};
window.addEventListener('pointerup', endPointer);
window.addEventListener('pointercancel', endPointer);
document.addEventListener('contextmenu', e => e.preventDefault());

// ---------------------------------------------------------------- input: toolbar
const g0 = $('#g0'), addBtn = $('#addPot'), picker = $('#picker');
function makePot(c, fresh) {
  const b = document.createElement('button');
  b.className = 'pot' + (fresh ? ' fresh' : ''); b.style.setProperty('--c', c); b.setAttribute('aria-label', 'paint');
  b.addEventListener('pointerdown', e => {
    e.preventDefault();
    try { b.setPointerCapture(e.pointerId); } catch (_) {}
    stopPour(); st.pouring = c; st.canColor = c; st.potEl = b; b.classList.add('pouring');
  });
  const stop = () => { if (st.potEl === b) stopPour(); };
  b.addEventListener('pointerup', stop); b.addEventListener('pointercancel', stop); b.addEventListener('lostpointercapture', stop);
  b.addEventListener('keydown', e => { if ((e.key === ' ' || e.key === 'Enter') && !e.repeat) { st.pouring = c; st.canColor = c; st.potEl = b; b.classList.add('pouring'); } });
  b.addEventListener('keyup', stop);
  g0.insertBefore(b, addBtn);
  return b;
}
function stopPour() {
  if (st.potEl) st.potEl.classList.remove('pouring');
  st.pouring = null; st.potEl = null;
}
const pots = PALETTE.map(c => makePot(c));
let customs = [];
addBtn.addEventListener('click', () => picker.click());
picker.addEventListener('change', () => {
  customs.push(makePot(picker.value, true));
  if (customs.length > 4) customs.shift().remove();
});
$('#undo').addEventListener('click', () => { st.layers.pop(); cup.angV += 0.08; });
$('#empty').addEventListener('click', () => { st.layers = []; cup.angV -= 0.16; });
$('#patch').addEventListener('click', () => {
  for (const h of st.holes) { const p = holePos(h); st.fx.push({ x: p.x, y: p.y, t: 0, k: 'patch' }); }
  st.holes = []; cup.angV += 0.06;
});
$$('.size').forEach(b => b.addEventListener('click', () => {
  st.holeSize = +b.dataset.a; $$('.size').forEach(o => o.classList.toggle('on', o === b));
}));
$('#len').addEventListener('input', e => setLength(e.target.value / 100));
$('#ff').addEventListener('click', e => { st.speed = st.speed === 1 ? 3 : 1; e.currentTarget.classList.toggle('on', st.speed > 1); });
$$('.swatch').forEach(b => b.addEventListener('click', () => {
  st.bg = b.dataset.bg; $$('.swatch').forEach(o => o.classList.toggle('on', o === b));
}));
$('#clear').addEventListener('click', () => {
  pctx.clearRect(0, 0, PR, PR); st.flash = 0.9;
  for (const h of st.holes) h.last = null;
});
$('#save').addEventListener('click', () => {
  const c = document.createElement('canvas'); c.width = c.height = PR;
  const x = c.getContext('2d');
  x.fillStyle = st.bg; x.fillRect(0, 0, PR, PR);
  x.fillStyle = x.createPattern(tex, 'repeat'); x.fillRect(0, 0, PR, PR);
  x.drawImage(paint, 0, 0);
  st.flash = 1;
  c.toBlob(blob => {
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob); a.download = 'pendulum-painting.png';
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 4000);
  });
});
const steps = $$('.step');
steps.forEach(b => b.addEventListener('click', () => setStage(+b.dataset.s)));
const nextBtn = $('#next');
nextBtn.addEventListener('click', () => setStage(Math.min(2, st.stage + 1)));

function setStage(s) {
  if (s === st.stage) return;
  stopPour(); st.growing = null; P.held = false;
  st.stage = s;
  $$('.group').forEach(g => g.classList.toggle('on', +g.dataset.g === s));
  steps.forEach((b, i) => b.classList.toggle('on', i === s));
  st.fade = 0.9; cv.style.cursor = 'default';
  requestAnimationFrame(layout);
}

function ui() {
  const lv = level();
  nextBtn.classList.toggle('show', (st.stage === 0 && lv > 0.02 && !st.pouring) || (st.stage === 1 && st.holes.length > 0 && !st.growing));
  steps[0].classList.toggle('nudge', st.stage !== 0 && lv < 0.001);
  steps[1].classList.toggle('nudge', st.stage === 2 && lv >= 0.001 && st.holes.length === 0);
  pots[0].classList.toggle('hint', !st.poured && st.stage === 0 && !st.pouring);
  $('#undo').disabled = !st.layers.length;
  $('#empty').disabled = !st.layers.length;
  $('#patch').disabled = !st.holes.length;
}

// ---------------------------------------------------------------- main loop
function update(dt) {
  time += dt;
  const sway = 0.012 * Math.sin(time * 0.9);
  cup.angV += (-(cup.ang - sway) * 14 - cup.angV * 1.6) * dt;
  cup.ang += cup.angV * dt;

  const pouringNow = st.stage === 0 && !!st.pouring;
  st.canT += ((pouringNow ? 1 : 0) - st.canT) * Math.min(1, dt * 10);
  st.ripple += ((pouringNow && st.canT > 0.85 ? 1 : 0) - st.ripple) * Math.min(1, dt * 4);
  if (pouringNow && st.canT > 0.85) {
    if (addPaint(st.pouring, POUR * dt)) { st.poured = true; cup.angV += (Math.random() - 0.5) * 0.03; }
    else cup.angV += (Math.random() - 0.5) * 0.25;         // full: the cup shivers
  }
  if (st.growing) st.growing.a = Math.min(3, st.growing.a + dt * 1.4);
  st.fx = st.fx.filter(f => (f.t += dt * 2.2) < 1);
  st.fade = Math.max(0, st.fade - dt * 4);
  st.flash = Math.max(0, st.flash - dt * 2.5);

  if (st.stage === 2) simulate(dt);
  if (P.held) {
    const now = performance.now();
    P.samples.push({ t: now, x: P.x, y: P.y });
    P.samples = P.samples.filter(p => now - p.t < 300);
  }
  ui();
}
function render() {
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  ctx.clearRect(0, 0, W, H);
  if (st.stage < 2) drawCupScene(); else drawCanvasScene();
  if (st.fade > 0) { ctx.fillStyle = `rgba(255,243,226,${st.fade})`; ctx.fillRect(0, 0, W, H); }
}
let last = performance.now();
function frame(now) {
  const dt = Math.min(0.033, Math.max(0, (now - last) / 1000)); last = now;
  update(dt); render();
  requestAnimationFrame(frame);
}

window.addEventListener('resize', resize);
resize();
requestAnimationFrame(frame);
})();
</script>
</body>
</html>
